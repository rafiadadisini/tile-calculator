<style>
  .calc-card {
    background: var(--color-background-primary);
    border: 0.5px solid var(--color-border-tertiary);
    border-radius: var(--border-radius-lg);
    padding: 1.25rem;
    margin-bottom: 12px;
  }
  .metric {
    background: var(--color-background-secondary);
    border-radius: var(--border-radius-md);
    padding: 1rem;
    text-align: center;
  }
  .metric-label {
    font-size: 13px;
    color: var(--color-text-secondary);
    margin: 0 0 4px;
  }
  .metric-value {
    font-size: 20px;
    font-weight: 500;
    color: var(--color-text-primary);
    margin: 0;
  }
  .metric-sub {
    font-size: 12px;
    color: var(--color-text-tertiary);
    margin: 4px 0 0;
  }
  .grid-5 {
    display: grid;
    grid-template-columns: repeat(5, minmax(0, 1fr));
    gap: 10px;
  }
  .grid-3 {
    display: grid;
    grid-template-columns: repeat(3, minmax(0, 1fr));
    gap: 12px;
  }
  .grid-2 {
    display: grid;
    grid-template-columns: repeat(2, minmax(0, 1fr));
    gap: 12px;
  }
  .row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 6px 0;
    border-bottom: 0.5px solid var(--color-border-tertiary);
    font-size: 14px;
  }
  .row:last-child {
    border-bottom: none;
  }
  .row-label {
    color: var(--color-text-secondary);
  }
  .row-value {
    font-weight: 500;
    color: var(--color-text-primary);
  }
  label {
    font-size: 13px;
    color: var(--color-text-secondary);
    display: block;
    margin-bottom: 4px;
  }
  .section-title {
    font-size: 13px;
    font-weight: 500;
    color: var(--color-text-secondary);
    text-transform: uppercase;
    letter-spacing: 0.05em;
    margin: 0 0 10px;
  }
  .price-highlight {
    background: var(--color-background-success);
    border-radius: var(--border-radius-md);
    padding: 1rem 1.25rem;
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-top: 4px;
  }
  .header-row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 10px;
  }
  .header-row .section-title {
    margin: 0;
  }
  .btn-reset {
    font-size: 12px;
    color: var(--color-text-danger, #e05);
    background: none;
    border: 1px solid var(--color-border-danger, #e05);
    border-radius: var(--border-radius-sm);
    padding: 3px 10px;
    cursor: pointer;
    line-height: 1.5;
  }
  .btn-reset:hover {
    background: var(--color-background-danger, rgba(220, 50, 50, 0.08));
  }
  .currency-wrapper {
    position: relative;
  }
  .currency-prefix {
    position: absolute;
    left: 8px;
    top: 50%;
    transform: translateY(-50%);
    font-size: 13px;
    color: var(--color-text-secondary);
    pointer-events: none;
    user-select: none;
  }
  .currency-input {
    padding-left: 32px !important;
    width: 100%;
    box-sizing: border-box;
  }
  input {
    width: 100%;
    box-sizing: border-box;
  }
  .btn-submit {
    width: 100%;
    padding: 10px;
    font-size: 15px;
    font-weight: 500;
    cursor: pointer;
    border: none;
    border-radius: var(--border-radius-md);
    background: var(--color-background-info, #2563eb);
    color: #fff;
    transition: opacity 0.15s;
  }
  .btn-submit:hover {
    opacity: 0.88;
  }
  .btn-submit:disabled {
    opacity: 0.4;
    cursor: not-allowed;
  }
  .error-msg {
    font-size: 12px;
    color: var(--color-text-danger, #e05);
    margin-top: 6px;
    min-height: 16px;
  }
  #result-section {
    display: none;
  }
</style>

<div style="padding: 0.5rem 0 1rem">
  <div class="calc-card">
    <div class="header-row">
      <p class="section-title">Parameter area</p>
      <button class="btn-reset" onclick="resetAll()">↺ Reset semua</button>
    </div>
    <div class="grid-2" style="margin-bottom: 12px">
      <div>
        <label>Luas area (m²)</label>
        <input
          type="number"
          id="area"
          value=""
          placeholder="0"
          step="0.01"
          min="0"
        />
      </div>
      <div>
        <label>Susut / waste (%)</label>
        <input
          type="number"
          id="waste"
          value=""
          placeholder="0"
          step="1"
          min="0"
          max="30"
        />
      </div>
    </div>
    <div class="grid-2">
      <div>
        <label>Ukuran granit — panjang (cm)</label>
        <input
          type="number"
          id="tw"
          value=""
          placeholder="0"
          step="1"
          min="0"
        />
      </div>
      <div>
        <label>Ukuran granit — lebar (cm)</label>
        <input
          type="number"
          id="th"
          value=""
          placeholder="0"
          step="1"
          min="0"
        />
      </div>
    </div>
  </div>

  <div class="calc-card">
    <p class="section-title">Parameter dus & harga</p>
    <div class="grid-3">
      <div>
        <label>Lembar per dus</label>
        <input
          type="number"
          id="perbox"
          value=""
          placeholder="0"
          step="1"
          min="0"
        />
      </div>
      <div>
        <label>Harga per dus</label>
        <div class="currency-wrapper">
          <span class="currency-prefix">Rp</span>
          <input
            class="currency-input"
            type="text"
            id="price-box"
            placeholder="0"
            oninput="onCurrencyInput(this)"
            onfocus="onCurrencyFocus(this)"
            onblur="onCurrencyBlur(this, 'box')"
          />
        </div>
      </div>
      <div>
        <label>Harga per m²</label>
        <div class="currency-wrapper">
          <span class="currency-prefix">Rp</span>
          <input
            class="currency-input"
            type="text"
            id="price-m2"
            placeholder="0"
            oninput="onCurrencyInput(this)"
            onfocus="onCurrencyFocus(this)"
            onblur="onCurrencyBlur(this, 'm2')"
          />
        </div>
      </div>
    </div>
  </div>

  <!-- Action row -->
  <div style="margin-bottom: 12px">
    <button class="btn-submit" id="btn-submit" onclick="handleSubmit()">
      Hitung Kebutuhan
    </button>
    <p class="error-msg" id="error-msg"></p>
  </div>

  <!-- Result -->
  <div
    class="calc-card"
    style="border: 1.5px solid var(--color-border-info)"
    id="result-section"
  >
    <p class="section-title" style="color: var(--color-text-info)">
      Hasil perhitungan
    </p>
    <div class="grid-5" style="margin-bottom: 16px">
      <div class="metric">
        <p class="metric-label">Luas + waste</p>
        <p
          class="metric-value"
          style="color: var(--color-text-info)"
          id="total-area"
        >
          —
        </p>
        <p class="metric-sub">m²</p>
      </div>
      <div class="metric">
        <p class="metric-label">Total lembar</p>
        <p class="metric-value" id="total-tiles">—</p>
        <p class="metric-sub">pcs dibutuhkan</p>
      </div>
      <div class="metric">
        <p class="metric-label">Kebutuhan dus</p>
        <p
          class="metric-value"
          style="color: var(--color-text-info)"
          id="total-box"
        >
          —
        </p>
        <p class="metric-sub">dus</p>
      </div>
      <div class="metric">
        <p class="metric-label">Lembar dibeli</p>
        <p class="metric-value" id="total-in-box">—</p>
        <p class="metric-sub">pcs</p>
      </div>
      <div class="metric">
        <p class="metric-label">Sisa lembar</p>
        <p
          class="metric-value"
          style="color: var(--color-text-warning)"
          id="leftover-tiles"
        >
          —
        </p>
        <p class="metric-sub" id="leftover-area">—</p>
      </div>
    </div>

    <div id="detail-rows"></div>

    <div id="price-section" style="display: none; margin-top: 12px">
      <div class="price-highlight">
        <div>
          <p
            style="margin: 0; font-size: 13px; color: var(--color-text-success)"
          >
            Total biaya material
          </p>
          <p
            style="
              margin: 4px 0 0;
              font-size: 11px;
              color: var(--color-text-secondary);
            "
            id="price-calc-note"
          >
            —
          </p>
        </div>
        <p
          style="
            margin: 0;
            font-size: 24px;
            font-weight: 500;
            color: var(--color-text-success);
          "
          id="total-price"
        >
          —
        </p>
      </div>
    </div>
  </div>
</div>

<script>
  function parseRaw(el) {
    return parseInt((el.value || "").replace(/\D/g, "")) || 0;
  }
  function formatCurrency(n) {
    return n ? n.toLocaleString("id-ID") : "";
  }
  function fmt(n) {
    return "Rp " + Math.round(n).toLocaleString("id-ID");
  }

  function onCurrencyInput(el) {
    const raw = parseRaw(el);
    const pos = el.selectionStart;
    const prevLen = el.value.length;
    el.value = raw ? formatCurrency(raw) : "";
    const diff = el.value.length - prevLen;
    try {
      el.setSelectionRange(pos + diff, pos + diff);
    } catch (e) {}
  }
  function onCurrencyFocus(el) {}
  function onCurrencyBlur(el, side) {
    const raw = parseRaw(el);
    el.value = raw ? formatCurrency(raw) : "";
    syncPrice(side);
  }
  function setCurrencyValue(id, n) {
    document.getElementById(id).value = n ? formatCurrency(n) : "";
  }

  function syncPrice(from) {
    const tw = parseFloat(document.getElementById("tw").value) || 0;
    const th = parseFloat(document.getElementById("th").value) || 0;
    const perbox = parseInt(document.getElementById("perbox").value) || 1;
    const tileArea = (tw / 100) * (th / 100);
    const boxArea = tileArea * perbox;
    if (from === "box") {
      const pb = parseRaw(document.getElementById("price-box"));
      setCurrencyValue("price-m2", boxArea > 0 ? Math.round(pb / boxArea) : 0);
    } else {
      const pm2 = parseRaw(document.getElementById("price-m2"));
      setCurrencyValue("price-box", Math.round(pm2 * boxArea));
    }
  }

  function validate() {
    const area = parseFloat(document.getElementById("area").value);
    const tw = parseFloat(document.getElementById("tw").value);
    const th = parseFloat(document.getElementById("th").value);
    const pb = parseInt(document.getElementById("perbox").value);
    if (!area || area <= 0) return "Luas area harus diisi dan lebih dari 0.";
    if (!tw || tw <= 0) return "Ukuran panjang granit harus diisi.";
    if (!th || th <= 0) return "Ukuran lebar granit harus diisi.";
    if (!pb || pb <= 0) return "Jumlah lembar per dus harus diisi.";
    return null;
  }

  function handleSubmit() {
    const err = validate();
    const errEl = document.getElementById("error-msg");
    if (err) {
      errEl.textContent = err;
      return;
    }
    errEl.textContent = "";
    calc();
    const res = document.getElementById("result-section");
    res.style.display = "block";
    res.scrollIntoView({ behavior: "smooth", block: "start" });
  }

  function calc() {
    const area = parseFloat(document.getElementById("area").value) || 0;
    const waste = parseFloat(document.getElementById("waste").value) || 0;
    const tw = parseFloat(document.getElementById("tw").value) || 0;
    const th = parseFloat(document.getElementById("th").value) || 0;
    const perbox = parseInt(document.getElementById("perbox").value) || 0;
    const priceBox = parseRaw(document.getElementById("price-box"));

    const tileArea = (tw / 100) * (th / 100);
    const totalArea = area * (1 + waste / 100);
    const totalTiles = Math.ceil(totalArea / tileArea);
    const totalBox = Math.ceil(totalTiles / perbox);
    const totalInBox = totalBox * perbox;
    const leftover = totalInBox - totalTiles;
    const leftoverArea = leftover * tileArea;
    const totalPrice = totalBox * priceBox;

    document.getElementById("total-area").textContent = totalArea.toFixed(2);
    document.getElementById("total-tiles").textContent = totalTiles;
    document.getElementById("total-box").textContent = totalBox;
    document.getElementById("total-in-box").textContent = totalInBox;
    document.getElementById("leftover-tiles").textContent = leftover + " pcs";
    document.getElementById("leftover-area").textContent =
      leftoverArea.toFixed(4) + " m²";

    document.getElementById("detail-rows").innerHTML = `
    <div class="row"><span class="row-label">Luas 1 lembar granit</span><span class="row-value">${tileArea.toFixed(4)} m² (${tw}×${th} cm)</span></div>
    <div class="row"><span class="row-label">Luas area asli</span><span class="row-value">${area.toFixed(2)} m²</span></div>
    <div class="row"><span class="row-label">Penambahan waste ${waste}%</span><span class="row-value">+${((area * waste) / 100).toFixed(2)} m²</span></div>
    <div class="row"><span class="row-label">Total area yang dibutuhkan</span><span class="row-value">${totalArea.toFixed(2)} m²</span></div>
    <div class="row"><span class="row-label">Jumlah lembar dibutuhkan</span><span class="row-value">${totalTiles} pcs</span></div>
    <div class="row"><span class="row-label">Jumlah dus (${totalTiles} ÷ ${perbox} lembar/dus)</span><span class="row-value" style="color:var(--color-text-info);">${totalBox} dus → ${totalInBox} pcs</span></div>
    <div class="row"><span class="row-label">Sisa lembar (${totalInBox} − ${totalTiles})</span><span class="row-value" style="color:var(--color-text-warning);">${leftover} pcs (${leftoverArea.toFixed(4)} m²)</span></div>
  `;

    const ps = document.getElementById("price-section");
    if (priceBox > 0) {
      ps.style.display = "block";
      document.getElementById("total-price").textContent = fmt(totalPrice);
      document.getElementById("price-calc-note").textContent =
        `${totalBox} dus × ${fmt(priceBox)}`;
    } else {
      ps.style.display = "none";
    }
  }

  function resetAll() {
    ["area", "waste", "tw", "th", "perbox"].forEach(
      (id) => (document.getElementById(id).value = ""),
    );
    document.getElementById("price-box").value = "";
    document.getElementById("price-m2").value = "";
    document.getElementById("error-msg").textContent = "";
    document.getElementById("result-section").style.display = "none";
  }
</script>
