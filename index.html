<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Meta Tags -->
    <meta
      name="keywords"
      content="kalkulator tile, kalkulator keramik, kalkulator granit, kalkulator marmer, kalkulator batu andesit, hitung kebutuhan tile, menghitung keramik, menghitung granit, menghitung marmer, aplikasi hitung keramik, aplikasi hitung granit, tile calculator, cara hitung keramik, berapa banyak keramik, kebutuhan keramik, kebutuhan granit, kalkulator area keramik, aplikasi kalkulator tile gratis, tool hitung keramik, kalkulasi material bangunan, gratis, kalkulator material bangunan, estimasi kebutuhan bahan, aplikasi gratis hitung bahan, kebutuhan batu hiasan, kalkulator proyek renovasi, hitung material konstruksi, estimasi biaya material, keramik lantai, granit countertop, perhitungan material online"
    />
    <meta
      name="description"
      content="Aplikasi sederhana untuk menghitung kebutuhan tile (Keramik, Granit, Marmer, Batu Andesit, dll) dengan mudah dan cepat!"
    />

    <!-- css -->
    <link rel="stylesheet" href="assets/style.css" />

    <!-- google fonts: Poppins -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap"
      rel="stylesheet"
    />

    <!-- google fonts: Roboto -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&family=Roboto:ital,wght@0,100..900;1,100..900&display=swap"
      rel="stylesheet"
    />

    <!-- Font Awesome -->
    <script
      src="https://kit.fontawesome.com/07168e4c20.js"
      crossorigin="anonymous"
    ></script>

    <!-- favicon -->
    <link
      rel="icon"
      type="image/x-icon"
      href="assets/img/new-rafiart-logo-rounded-ico.ico"
    />
    <title>Tile Calculator</title>
  </head>

  <!-- body -->
  <body class="flex flex-col bg-slate-100 min-h-dvh">
    <!-- Header -->
    <header id="Header">
      <div class="mt-24 w-full text-center">
        <h1
          class="pb-1 font-roboto font-bold text-warnautama text-4xl uppercase header-title"
        >
          Tile Calculator
        </h1>
      </div>
      <div class="flex justify-center">
        <div
          class="mb-10 p-2 border-sky-100 rounded w-1/4 text-center header-subtitle ba"
        >
          <p class="font-roboto text-slate-500 text-sm">
            Aplikasi sederhana untuk menghitung kebutuhan tile (Keramik, Granit,
            Marmer, Batu Andesit, dll) dengan mudah dan cepat!
          </p>
        </div>
      </div>
    </header>

    <main id="main" class="flex-1 font-roboto">
      <!-- Input Parameter -->
      <section id="parameter" class="flex justify-center">
        <div class="gap-4 grid grid-cols-2 w-9/12 item">
          <!-- card area -->
          <div class="col-1">
            <div class="bg-white shadow-xl p-5 rounded-2xl calc-card">
              <div class="text-center header-row">
                <h3
                  class="mb-3 font-bold text-warnautama text-2xl section-title"
                >
                  Area
                </h3>
              </div>

              <!-- Input luas area dan waste -->
              <div class="gap-4 grid grid-cols-1 md:grid-cols-4">
                <div class="md:col-span-2 col-auto">
                  <div class="text-center">
                    <label class="text-slate-600">Luas area (m²)</label>
                  </div>
                  <div class="text-center">
                    <input
                      class="bg-slate-200 p-1.5 border-2 border-warnakedua rounded-xl focus:outline-warnautama w-full slashed-zero text-gray-500 placeholder:text-gray-500 text-center"
                      type="number"
                      id="area"
                      value="0"
                      step="0.01"
                      min="0"
                      oninput="calc()"
                    />
                  </div>
                </div>

                <div class="md:col-span-2 col-auto">
                  <div class="text-center">
                    <label class="text-slate-700"
                      >Susut / Waste Factor (%)</label
                    >
                  </div>
                  <div class="text-center">
                    <input
                      class="bg-slate-200 p-1.5 border-2 border-warnakedua rounded-xl focus:outline-warnautama w-full slashed-zero text-gray-500 placeholder:text-gray-300 text-center"
                      type="number"
                      id="waste"
                      value="0"
                      step="0.1"
                      min="0"
                      max="75"
                      oninput="calc()"
                    />
                  </div>
                </div>
              </div>
            </div>
          </div>

          <!-- card ukuran -->
          <div class="col-2">
            <div class="bg-white shadow-xl p-5 rounded-2xl calc-card">
              <div class="text-center header-row">
                <h3
                  class="mb-3 font-bold text-warnautama text-2xl section-title"
                >
                  Ukuran Tile
                </h3>
              </div>

              <!-- Input ukuran -->
              <div class="gap-4 grid grid-cols-1 md:grid-cols-4">
                <div class="md:col-span-2 col-auto">
                  <div class="text-center">
                    <label class="text-slate-700">Ukuran panjang (cm)</label>
                  </div>
                  <div class="text-center">
                    <input
                      class="bg-slate-200 p-1.5 border-2 border-warnakedua rounded-xl focus:outline-warnautama w-full slashed-zero text-gray-500 placeholder:text-gray-300 text-center"
                      type="number"
                      id="tw"
                      value="0"
                      step="0.1"
                      min="0"
                      oninput="calc()"
                    />
                  </div>
                </div>

                <div class="md:col-span-2 col-auto">
                  <div class="text-center">
                    <label class="text-slate-700">Ukuran lebar (cm)</label>
                  </div>
                  <div class="text-center">
                    <input
                      class="bg-slate-200 p-1.5 border-2 border-warnakedua rounded-xl focus:outline-warnautama w-full slashed-zero text-gray-500 placeholder:text-gray-300 text-center"
                      type="number"
                      id="th"
                      value="0"
                      step="0.1"
                      min="0"
                      oninput="calc()"
                    />
                  </div>
                </div>
              </div>
            </div>
          </div>

          <!-- card harga -->
          <div class="col-span-2">
            <div class="bg-white shadow-xl p-5 rounded-2xl calc-card back">
              <div class="text-center header-row">
                <h3
                  class="mb-3 font-bold text-warnautama text-2xl section-title"
                >
                  Harga
                </h3>
              </div>

              <div class="flex justify-center gap-4">
                <div class="w-full md:w-1/4">
                  <div class="text-center">
                    <label class="text-slate-700 text-sm">
                      Isi per box (Keping)
                    </label>
                  </div>
                  <div>
                    <input
                      class="bg-slate-200 p-1.5 border-2 border-warnakedua rounded-xl focus:outline-warnautama w-full slashed-zero text-gray-500 placeholder:text-gray-500 text-center"
                      type="number"
                      id="perbox"
                      placeholder="0"
                      value="0"
                      step="1"
                      min="0"
                      oninput="calc()"
                    />
                  </div>
                </div>

                <div class="w-full md:w-1/4">
                  <div class="text-center">
                    <label class="text-slate-700 text-sm">
                      Harga per box (Rp)
                    </label>
                  </div>
                  <div class="currency-wrapper">
                    <input
                      class="bg-slate-200 p-1.5 border-2 border-warnakedua rounded-xl focus:outline-warnautama w-full slashed-zero text-gray-500 placeholder:text-gray-500 text-center currency-input"
                      type="text"
                      id="price-box"
                      placeholder="0"
                      oninput="onCurrencyInput(this)"
                      onfocus="onCurrencyFocus(this)"
                      onblur="onCurrencyBlur(this, 'box')"
                    />
                  </div>
                </div>
                <div class="w-full md:w-1/4">
                  <div class="text-center">
                    <label class="text-slate-700 text-sm">
                      Harga per m² (Rp)
                    </label>
                  </div>
                  <div class="currency-wrapper">
                    <input
                      class="bg-slate-200 p-1.5 border-2 border-warnakedua rounded-xl focus:outline-warnautama w-full slashed-zero text-gray-500 placeholder:text-gray-500 text-center currency-input"
                      type="text"
                      id="price-m2"
                      placeholder="0"
                      oninput="onCurrencyInput(this)"
                      onfocus="onCurrencyFocus(this)"
                      onblur="onCurrencyBlur(this, 'm2')"
                    />
                  </div>
                </div>
              </div>
            </div>
          </div>
        </div>
      </section>
      <!-- end Input Parameter -->

      <!-- Action Buttons -->
      <section id="actions">
        <div class="flex justify-center mt-2 mb-10">
          <div class="flex justify-between gap-4 p-5 w-1/2">
            <div class="calc-card">
              <button
                class="bg-warnautama hover:bg-warnakeempat px-10 py-1.5 rounded-2xl font-bold text-white hover:text-warnautama text-center uppercase cursor-pointer btn-reset"
                onclick="resetAll()"
              >
                🗘 Reset
              </button>
            </div>
            <div class="text-center uppercase calc-card">
              <button
                class="bg-warnautama hover:bg-warnakeempat px-10 py-1.5 rounded-2xl font-bold text-white hover:text-warnautama text-center uppercase cursor-pointer btn-reset"
                id="btn-submit"
                onclick="handleSubmit()"
              >
                🖩 Hitung
              </button>
            </div>
          </div>
        </div>

        <div
          class="flex justify-center mt-2 mb-5 text-red-600 text-sm text-center"
        >
          <p
            class="p-2 rounded-3xl w-1/2 font-light error-msg"
            id="error-msg"
          ></p>
        </div>
      </section>

      <!-- Hasil Perhitungan -->
      <section id="hasil">
        <div
          id="result-section"
          class="flex justify-center mb-16"
          style="display: flex"
        >
          <div class="bg-white shadow-xl p-5 rounded-4xl w-5/6 calc-card back">
            <div class="text-2xl text-center section-title">
              <h2
                class="mb-5 border-warnautama border-b-2 font-bold text-warnautama"
              >
                HASIL PERHITUNGAN
              </h2>
            </div>

            <!-- card hasil -->
            <div class="gap-4 grid grid-cols-2 md:grid-cols-3 lg:grid-cols-5">
              <div
                class="bg-warnakeempat shadow-xl border-4 border-white rounded-xl col-auto"
              >
                <div class="text-center metric">
                  <div
                    class="bg-color-pertama bg-warnautama p-2.5 rounded-t w-full font-bold text-white metric-label"
                  >
                    <label class="uppercase"> Luas + Waste </label>
                  </div>
                  <p
                    class="pt-5 slashed-zero text-warnautama text-3xl text-center metric-value"
                    id="total-area"
                  >
                    0
                  </p>
                  <p class="pb-5 text-slate-600 metric-sub">m²</p>
                </div>
              </div>

              <div
                class="bg-warnakeempat shadow-xl border-4 border-white rounded-xl col-auto"
              >
                <div class="text-center metric">
                  <div
                    class="bg-color-pertama bg-warnautama p-2.5 rounded-t w-full font-bold text-white metric-label"
                  >
                    <label class="uppercase"> Total Kebutuhan </label>
                  </div>
                  <p
                    class="pt-5 slashed-zero text-warnautama text-3xl text-center metric-value"
                    id="total-tiles"
                  >
                    0
                  </p>
                  <p class="pb-5 text-slate-600 metric-sub">Keping</p>
                </div>
              </div>

              <div
                class="bg-warnakeempat shadow-xl border-4 border-white rounded-xl col-auto"
              >
                <div class="text-center metric">
                  <div
                    class="bg-color-pertama bg-warnautama p-2.5 rounded-t w-full font-bold text-white metric-label"
                  >
                    <label class="uppercase"> Total Box </label>
                  </div>
                  <p
                    class="pt-5 slashed-zero text-warnautama text-3xl text-center metric-value"
                    id="total-box"
                  >
                    0
                  </p>
                  <p class="pb-5 text-slate-600 metric-sub">Box</p>
                </div>
              </div>

              <div
                class="bg-warnakeempat shadow-xl border-4 border-white rounded-xl col-auto"
              >
                <div class="text-center metric">
                  <div
                    class="bg-color-pertama bg-warnautama p-2.5 rounded-t w-full font-bold text-white metric-label"
                  >
                    <label class="uppercase"> Total keping dibeli </label>
                  </div>
                  <p
                    class="pt-5 slashed-zero text-warnautama text-3xl text-center metric-value"
                    id="total-in-box"
                  >
                    0
                  </p>
                  <p class="pb-5 text-slate-600 metric-sub">Keping</p>
                </div>
              </div>

              <div
                class="bg-warnakeempat shadow-xl border-4 border-white rounded-xl col-auto"
              >
                <div class="text-center metric">
                  <div
                    class="bg-color-pertama bg-warnautama p-2.5 rounded-t w-full font-bold text-white metric-label"
                  >
                    <label class="uppercase"> Sisa </label>
                  </div>
                  <p
                    class="pt-5 slashed-zero text-warnautama text-3xl text-center metric-value"
                    id="leftover-tiles"
                  >
                    0
                  </p>
                  <p class="pb-5 text-slate-600 metric-sub" id="leftover-area">
                    —
                  </p>
                </div>
              </div>
            </div>
            <!-- end card hasil -->

            <!-- hasil detail -->
            <div id="detail-rows" class="bg-slate-100 mt-10 p-5 rounded-2xl">
              <div
                class="grid grid-cols-2 pt-3 border-warnautama border-b-2 row"
              >
                <span
                  class="font-bold text-warnakedua text-left uppercase row-label"
                  >label</span
                >
                <span class="text-warnautama text-right row-value">value</span>
              </div>
            </div>

            <!-- total harga -->
            <div id="price-section" style="display: none">
              <div class="mt-5 p-0.5 rounded-md">
                <div
                  class="flex justify-between m-3 py-2 border-warnautama border-y-2 price-highlight"
                >
                  <div class="items-center text-left">
                    <p class="font-bold text-warnautama uppercase">
                      Total biaya material
                    </p>
                    <p id="price-calc-note" class="text-warnakedua">—</p>
                  </div>
                  <div class="items-center">
                    <p
                      id="total-price"
                      class="pt-2 font-bold text-warnautama text-3xl text-right"
                    >
                      —
                    </p>
                  </div>
                </div>
              </div>
            </div>
          </div>
        </div>
      </section>
      <!-- end Hasil Perhitungan -->
    </main>

    <!-- Footer -->
    <footer>
      <div class="bg-warnautama mx-auto pt-10 h-20 text-white text-center">
        <div class="content-center text-base">
          <a href="https://tinyurl.com/rafiadadisini">
            <img
              src="assets/img/new-rafiart-logo-rounded-ico.ico"
              class="inline-block pl-3 h-5"
            />
            <i class="far fa-copyright"></i>
            <span>rafiadadisini</span>
          </a>
        </div>
      </div>
    </footer>

    <!-- script -->
    <script src="assets/app.js"></script>
  </body>
</html>
